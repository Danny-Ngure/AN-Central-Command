  <polygon points="50,18 82,72 18,72" fill="#ff6600"/>
  <polygon points="50,30 72,66 28,66" fill="#025e73"/>
  <polygon points="50,40 64,62 36,62" fill="#00ccff"/>
  <rect x="34" y="78" width="32" height="14" rx="3" fill="none" stroke="#025e73" stroke-width="2"/>
</svg>
